<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <!--  
        id: refers the element in frontend and it is unique for each element
        linking
        styling
        scripting

        name: refers the element in backend and it is not unique for each element
    -->
    <form action="3_anchor.html" method="post">
        <label for="name">Name:</label> 
        <input type="text" name="name" placeholder="Enter your name" id="name"><br><br>


        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email" id="email"><br><br>


        <label for="password">Password:</label>
        <input type="password" name="password" placeholder="Enter your password" id="password"><br><br>


        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label><br><br>

        <lable type="checkbox" for="Language">Languages:</lable>
        <input type="checkbox" name="language" value="English" id="English">
        <label for="English">English</label>
        <input type="checkbox" name="language" value="Hindi" id="Hindi">
        <label for="Hindi">Hindi</label>
        <input type="checkbox" name="language" value="Marathi" id="Marathi">
        <label for="Marathi">Marathi</label> 
        <input type="checkbox" name="language" value="Other" id="Other">
        <label for="Other">Other</label><br><br>

        <label for="city">city:</label>
        <select name="city" id="city">
            <option value="">Select your city</option>
            <option value="pune">Pune</option>
            <option value="mumbai">Mumbai</option>
            <option value="nagpur">Nagpur</option>
            <option value="nashik">Nashik</option>
        </select><br><br>

        <label for="date">Select Date:</label>
        <input type="date" name="date" id="date"><br><br>

        <label for="college">College:</label>
        <input type="text" list="datalist" id="college" name="college" placeholder="Enter your college"><br><br>
        <datalist id="datalist">
            <option value="MIT">
            <option value="PCCOE">
            <option value="COEP">
            <option value="VIT">
        </datalist><br><br> 

        <input type="submit" value="Submit">
        <input type="button" value="Submit">
        <button type="reset">Reset</button>
    </form>
</body>
</html>
